# Render 블루프린트.
# 대시보드에서 New > Blueprint 로 이 저장소를 연결하면 이 설정대로 만들어진다.
services:
  - type: web
    name: neat-bid-collector
    runtime: docker          # 크로미움 때문에 도커로 배포한다
    plan: standard           # 크로미움이 메모리를 많이 써서 512MB(free/starter)로는 중간에 죽는다
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
